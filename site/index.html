<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com wss://*.firebaseio.com https://*.pythonanywhere.com; frame-src https://*.firebaseapp.com https://*.web.app https://accounts.google.com https://apis.google.com; object-src 'none'; base-uri 'none'; form-action 'self'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<meta name="description" content="عابدين – سوق إلكتروني لكل ما يحتاجه بيتك وعائلتك: أثاث، مواد غذائية، ملابس، إلكترونيات، خدمات وأكثر. السويس، مصر.">
<title>عابدين</title>
<link rel="icon" href="images/logo.png">
<link rel="apple-touch-icon" href="images/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--teal:#0C4A45;--teal2:#07302C;--brass:#E8A93D;--bone:#F7F6F2;--stone:#EFEDE6;--sage:#DCE4DF;--ink:#17201E;--mute:#5B655F;--sale:#C0392B;--ok:#1E8E5A;--line:#DEE3DE;--surface:#ffffff;--surface2:#eef3f0;--site-bg-img:none;--tx:#0C4A45;--on-brand:#ffffff;--on-accent:#1b1407;--brand-rgb:12,74,69;--brand2-rgb:7,48,44}
:root[data-theme="dark"]{--teal:#163F3B;--teal2:#0A2622;--brass:#E8B55A;--bone:#13201D;--stone:#1b2824;--sage:#223330;--ink:#EDF3F0;--mute:#9FB3AC;--sale:#E07A6E;--ok:#6FCB9B;--line:#2B3C37;--surface:#1b2824;--surface2:#213330}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--teal:#163F3B;--teal2:#0A2622;--brass:#E8B55A;--bone:#13201D;--stone:#1b2824;--sage:#223330;--ink:#EDF3F0;--mute:#9FB3AC;--sale:#E07A6E;--ok:#6FCB9B;--line:#2B3C37;--surface:#1b2824;--surface2:#213330}}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;font:400 16px/1.75 'Tajawal','Segoe UI',Tahoma,sans-serif;color:var(--ink);background-color:var(--bone);background-image:linear-gradient(rgba(245,246,243,.93),rgba(245,246,243,.93)),var(--site-bg-img);background-size:cover;background-attachment:fixed;background-position:center;min-height:100vh;display:flex;flex-direction:column;transition:background-color .2s,color .2s}
:root[data-theme="dark"] body{background-image:linear-gradient(rgba(16,25,23,.92),rgba(16,25,23,.92)),var(--site-bg-img)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) body{background-image:linear-gradient(rgba(16,25,23,.92),rgba(16,25,23,.92)),var(--site-bg-img)}}
main{flex:1}
h1,h2,h3,.brandname{font-family:'Tajawal',sans-serif;line-height:1.35;margin:0;font-weight:700}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
img,svg{display:block;max-width:100%}
.wrap{width:min(1200px,calc(100% - 32px));margin-inline:auto}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 20px;border-radius:10px;border:1.5px solid transparent;cursor:pointer;font-weight:700;transition:background .15s,color .15s;background:none;text-align:center}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-brass{background:var(--brass);color:var(--on-accent)}.btn-brass:hover{background:#c9993f}
.btn-teal{background:var(--teal);color:var(--on-brand)}.btn-teal:hover{background:var(--teal2)}
.btn-line{border-color:var(--teal);color:var(--tx)}.btn-line:hover{background:var(--sage)}
.btn-white{border-color:rgba(255,255,255,.6);color:#fff}.btn-white:hover{background:rgba(255,255,255,.12)}
.btn-danger{background:var(--sale);color:#fff}
.btn-wa{background:#1FA855;color:#fff}.btn-wa:hover{background:#188a45}
.btn-sm{min-height:36px;padding:0 12px;font-size:14px;border-radius:8px}
.btn-block{width:100%}
.ico{width:20px;height:20px;flex:none}
.notice{background:#ffffff;color:#2F6B4F;font-size:14px;border-bottom:1px solid var(--line);overflow:hidden}
.ticker{display:flex;white-space:nowrap;width:max-content;animation:tickerScroll 26s linear infinite}
.ticker span{display:inline-flex;align-items:center;gap:10px;padding:8px 36px;font-weight:700;flex:none}
.ticker span::before{content:"•";color:var(--brass);font-weight:900}
@keyframes tickerScroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.notice:hover .ticker{animation-play-state:paused}
header.top{background:var(--surface);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:30}
.bar{display:flex;align-items:center;gap:16px;padding:10px 0}
.brand{display:flex;align-items:center;gap:10px;flex:none}
.brand svg{width:46px;height:46px}
.brand-icon{width:46px;height:46px;object-fit:contain;flex:none}
:root[data-theme="dark"] .brand-icon{filter:invert(1)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .brand-icon{filter:invert(1)}}
.credit img{background:#fff;border-radius:4px;padding:1px}
.brandname{font-size:20px;color:var(--tx);white-space:nowrap}
.brandsub{display:block;font:500 12px 'Tajawal',sans-serif;color:var(--mute);margin-top:-2px}
.search{flex:1;display:flex;max-width:520px;margin-inline:auto}
.search input{flex:1;min-width:0;height:44px;border:1.5px solid var(--line);border-inline-end:0;border-radius:0 10px 10px 0;padding:0 14px;background:var(--bone)}
.search button{width:48px;border:0;background:var(--teal);color:var(--on-brand);border-radius:10px 0 0 10px;cursor:pointer;display:grid;place-items:center}
.tools{display:flex;gap:8px;align-items:center;margin-inline-start:auto;position:relative}
.tbtn{position:relative;display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);cursor:pointer;font-weight:700}
.tbtn:hover{border-color:var(--teal)}
.badge{position:absolute;top:-7px;inset-inline-start:-7px;min-width:20px;height:20px;border-radius:10px;background:var(--brass);color:var(--on-accent);font-size:12px;display:grid;place-items:center;padding:0 5px;font-weight:700}
.menu{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:250px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 32px rgba(10,56,54,.16);padding:6px;z-index:40}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:10px;padding:10px 12px;border:0;background:none;border-radius:8px;text-align:start;cursor:pointer}
.menu a:hover,.menu button:hover{background:var(--stone)}
.menu hr{border:0;border-top:1px solid var(--line);margin:6px 0}
.menu .who{padding:8px 12px;font-size:14px;color:var(--mute)}
.catbar{border-top:1px solid var(--line);background:var(--surface)}
.catbar .wrap{display:flex;gap:4px;overflow-x:auto;scrollbar-width:thin}
.catbar a{flex:none;padding:9px 14px;font-size:15px;font-weight:500;color:var(--mute);border-bottom:3px solid transparent}
.catbar a:hover,.catbar a.on{color:var(--tx);border-color:var(--brass)}
.hero{background:var(--teal);color:var(--on-brand);overflow:hidden}
.hero-in{display:grid;grid-template-columns:1.15fr .85fr;gap:32px;align-items:end;padding-top:44px}
.hero-txt{padding-bottom:52px}
.hero h1{font-size:clamp(30px,5vw,50px)}
.hero p{font-size:18px;color:inherit;opacity:.9;max-width:34ch;margin:16px 0 26px}
.cta{display:flex;gap:12px;flex-wrap:wrap}
.arch{position:relative;justify-self:center;width:min(100%,400px);aspect-ratio:480/560;border-radius:999px 999px 0 0;overflow:hidden;border:6px solid var(--brass);border-bottom:0;background:var(--sage)}
.arch svg{width:100%;height:100%}
.promo{position:absolute;inset-block-start:26%;inset-inline-start:-4px;z-index:2;width:104px;height:104px;border-radius:50%;background:var(--brass);color:var(--on-accent);display:grid;place-items:center;text-align:center;font:700 15px/1.25 'Tajawal',sans-serif;box-shadow:0 6px 18px rgba(0,0,0,.25);transform:rotate(-8deg)}
.promo b{display:block;font-size:30px;line-height:1}
.archwrap{position:relative;justify-self:center;width:min(100%,400px)}
.trust{background:var(--surface);border-bottom:1px solid var(--line)}
.trust .wrap{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.trust div{display:flex;gap:12px;align-items:center;padding:16px 8px}
.trust svg{color:var(--brass);width:28px;height:28px}
.trust b{display:block;font-size:15px}.trust span{font-size:13px;color:var(--mute);line-height:1.4;display:block}
section.blk{padding:44px 0}
.sh{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:20px}
.sh h2{font-size:28px;color:var(--tx)}
.sh a{color:var(--tx);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;text-align:center;transition:border-color .15s}
.tile:hover{border-color:var(--teal)}
.tile img{aspect-ratio:4/3;object-fit:cover;width:100%}
.tile span{display:block;padding:10px 8px;font-weight:700;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;position:relative}
.card .im{position:relative;display:block}
.card .im img{aspect-ratio:4/3;object-fit:cover;width:100%}
.sale{position:absolute;top:10px;inset-inline-start:10px;background:var(--sale);color:#fff;border-radius:8px;padding:2px 10px;font-weight:700;font-size:14px}
.card .in{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;flex:1}
.card h3{font:700 16px/1.5 'Tajawal',sans-serif}
.cat-l{font-size:13px;color:var(--mute)}
.price{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap;margin-top:auto}
.price b{font-size:19px;color:var(--tx)}
.price .unit{font-size:13px;color:var(--mute)}
.price s{color:var(--mute);font-size:14px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:20px}
.chip{padding:6px 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);font-weight:500;font-size:15px;cursor:pointer}
.chip.on{background:var(--teal);color:var(--on-brand);border-color:var(--teal)}
select,input[type=text],input[type=email],input[type=tel],input[type=password],input[type=number],textarea{width:100%;min-height:44px;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--surface);color:var(--ink)}
textarea{min-height:110px;resize:vertical;line-height:1.7}
select{width:auto}
label.f{display:block;margin-bottom:14px;font-weight:700;font-size:15px}
label.f>span{display:block;margin-bottom:4px}
label.f small{font-weight:400;color:var(--mute)}
.err{color:var(--sale);font-size:14px;min-height:22px;margin:0 0 8px}
.pd{display:grid;grid-template-columns:1fr 1fr;gap:36px;padding:32px 0}
.pd .pic{border-radius:16px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.pd .pic img{width:100%;aspect-ratio:4/3;object-fit:cover}
.pd h1{font-size:32px;color:var(--tx)}
.pd .price b{font-size:30px}
.qty{display:inline-flex;align-items:center;border:1.5px solid var(--line);border-radius:10px;background:var(--surface)}
.qty button{width:40px;height:42px;border:0;background:none;font-size:20px;cursor:pointer}
.qty span{min-width:34px;text-align:center;font-weight:700}
.crumbs{font-size:14px;color:var(--mute);padding-top:20px}
.crumbs a{color:var(--tx)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:24px;padding:28px 0;align-items:start}
.line{display:grid;grid-template-columns:84px 1fr auto;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--line)}
.line:last-child{border:0}
.line img{width:84px;height:64px;object-fit:cover;border-radius:8px}
.line h3{font:700 16px 'Tajawal',sans-serif}
.rm{border:0;background:none;color:var(--sale);cursor:pointer;font-size:14px;padding:4px 0}
.sum{display:flex;justify-content:space-between;padding:6px 0}
.sum.t{border-top:1px solid var(--line);margin-top:8px;padding-top:12px;font-size:19px;font-weight:700;color:var(--tx)}
.empty{text-align:center;padding:56px 16px;color:var(--mute)}
.empty svg{margin:0 auto 12px;color:var(--brass);width:48px;height:48px}
.varblock{margin:14px 0}
.varlabel{display:block;font-weight:700;font-size:14px;margin-bottom:8px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatch{width:36px;height:36px;border-radius:50%;border:2px solid var(--line);cursor:pointer;display:grid;place-items:center;font-size:10px;font-weight:700;background:var(--surface);padding:0}
.swatch.on{border-color:var(--tx);box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--tx)}
.sizechips{display:flex;gap:8px;flex-wrap:wrap}
.szchip{min-width:42px;height:38px;padding:0 14px;border-radius:9px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;font-weight:700}
.szchip.on{border-color:var(--tx);background:var(--tx);color:var(--on-brand)}
.varmeta{font-size:13px;color:var(--mute);margin:3px 0}
.overlay.drawer-ov{display:flex;justify-content:flex-end;align-items:stretch;padding:0}
.drawer{width:min(420px,92vw);height:100%;background:var(--surface);display:flex;flex-direction:column;box-shadow:-24px 0 48px -20px rgba(0,0,0,.4);animation:drawerIn .25s ease;overflow:hidden}
@keyframes drawerIn{from{transform:translateX(100%)}to{transform:translateX(0)}}
.drawer-h{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);flex:none}
.drawer-h h2{font-size:19px;color:var(--tx)}
.drawer-body{flex:1;overflow-y:auto;padding:0 18px}
.drawer-body .line{padding:14px 0}
.drawer-f{padding:16px 18px;border-top:1px solid var(--line);flex:none}
.cat-cards{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.cat-card{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:start;transition:transform .2s,box-shadow .2s}
.cat-card:hover{transform:translateY(-2px);box-shadow:0 14px 28px -20px rgba(0,0,0,.4)}
.cat-badge{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:22px;background:var(--surface2)}
.cat-txt h3{font-size:16px;margin:0 0 3px}
.cat-sub{font-size:13px;color:var(--mute);margin:0;line-height:1.5}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-inline-end:6px;border:1px solid var(--line);vertical-align:-1px}
.flt{font-size:14px;margin-inline-end:4px}
.feats{display:flex;gap:10px;flex-wrap:wrap}
.chk{display:inline-flex;gap:4px;align-items:center;font-size:13px;white-space:nowrap}
.chk input{width:auto;min-height:0}
.hrs{margin-top:6px;line-height:1.7}
@media (max-width:640px){.cat-cards{grid-template-columns:1fr 1fr}.cat-card{padding:12px;gap:10px}.cat-badge{width:40px;height:40px;font-size:18px}}
.arch img{width:100%;height:100%;object-fit:cover;display:block}
.pgbanner{background:linear-gradient(rgba(var(--brand-rgb),.80),rgba(var(--brand2-rgb),.80)),var(--pgimg) center/cover;background-size:cover;color:var(--on-brand);padding:34px 0}
.pgbanner h1{font-size:27px;color:var(--on-brand)}
.pgbanner p{margin:6px 0 0;color:inherit;opacity:.9;font-size:15px}
.home-lnk{display:flex!important;align-items:center;padding:0 12px!important}
.credit{display:flex;align-items:center;gap:4px;font:500 11px 'Tajawal',sans-serif;color:var(--mute);opacity:.8;margin-top:1px}
.credit img{height:14px;width:auto;display:block}
.pay{display:grid;gap:10px;margin-bottom:14px}
.pay label{display:flex;gap:10px;align-items:flex-start;border:1.5px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:var(--surface)}
.pay input{margin-top:6px;accent-color:var(--teal)}
.pay label:has(input:checked){border-color:var(--teal);background:var(--surface2)}
.hint{background:var(--surface2);border:1px dashed var(--teal);border-radius:10px;padding:12px;font-size:15px;margin-bottom:14px}
.status{display:inline-block;padding:2px 12px;border-radius:999px;font-size:14px;font-weight:700;background:var(--sage);color:var(--tx)}
.status.delivered{background:#d8eee1;color:var(--ok)}.status.cancelled{background:#f5d9d5;color:var(--sale)}
.tl{list-style:none;display:flex;padding:0;margin:14px 0 4px;gap:0}
.tl li{flex:1;text-align:center;font-size:13px;color:var(--mute);position:relative;padding-top:22px;line-height:1.4}
.tl li::before{content:"";position:absolute;top:0;left:0;right:0;height:6px;background:var(--line);border-radius:3px;margin-inline:2px}
.tl li.on{color:var(--tx);font-weight:700}
.tl li.on::before{background:var(--teal)}
.order{border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px;background:var(--surface)}
.order header{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.legal{max-width:780px;padding:36px 0 56px}
.legal h1{font-size:34px;color:var(--tx);margin-bottom:18px}
.legal h3{font-size:20px;margin:26px 0 6px;color:var(--tx)}
.legal p{margin:0 0 12px}
footer.ft{background:var(--teal2);color:#c9dbd6;margin-top:40px}
.ft .cols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1.2fr;gap:28px;padding:40px 0 24px}
.ft h4{font:700 17px 'Tajawal',sans-serif;color:#fff;margin:0 0 10px}
.ft ul{list-style:none;margin:0;padding:0}.ft li{margin:6px 0}
.ft a:hover{color:#fff;text-decoration:underline}
.ft .cp{border-top:1px solid rgba(255,255,255,.14);padding:16px 0;text-align:center;font-size:14px}
.soc{display:flex;gap:10px;margin-top:10px}
.soc button{border:0;background:none;padding:0;cursor:pointer;width:40px;height:40px;border-radius:50%}
.soc svg{width:40px;height:40px}
.overlay{position:fixed;inset:0;background:rgba(10,30,28,.55);z-index:60;display:grid;place-items:center;padding:16px;overflow:auto}
.modal{background:var(--surface);border-radius:16px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:24px;position:relative}
.modal.wide{width:min(640px,100%)}
.modal h2{font-size:24px;color:var(--tx);margin-bottom:6px}
.x{position:absolute;top:12px;inset-inline-start:12px;width:36px;height:36px;border:0;background:var(--stone);border-radius:50%;cursor:pointer;font-size:20px;line-height:1}
.tabs{display:flex;gap:6px;margin:14px 0}
.tabs button{flex:1;height:42px;border:1.5px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;cursor:pointer}
.tabs button.on{background:var(--teal);color:var(--on-brand);border-color:var(--teal)}
.shield{display:flex;gap:10px;align-items:center;background:var(--surface2);border-radius:10px;padding:10px 12px;font-size:14px;margin-bottom:14px;color:var(--teal2)}
.shield svg{color:var(--ok);flex:none}
.or{display:flex;align-items:center;gap:10px;color:var(--mute);font-size:14px;margin:14px 0}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.soc-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);font-weight:700;cursor:pointer;margin-bottom:10px;transition:box-shadow .15s,border-color .15s}
.soc-btn.google:hover{box-shadow:0 8px 20px -12px rgba(0,0,0,.35);border-color:var(--teal)}
.soc-btn:hover{background:var(--bone)}
.soc-btn svg{width:22px;height:22px}
.link{background:none;border:0;color:var(--tx);text-decoration:underline;cursor:pointer;padding:0;font-weight:500}

  pages:{
about:`# من نحن
عابدين سوق إلكتروني واحد لكل ما يحتاجه بيتك وعائلتك، ومقره السويس – الأربعين – شارع الجيش.

نوفر الأثاث والمفروشات، والمواد الغذائية والخضروات والأسماك والعطارة، والملابس والأحذية، والإلكترونيات والأجهزة، والخدمات المنزلية والمهنية، ومستلزمات السيارات والدراجات، والعطور والتجميل، بأسعار واضحة وخصومات على أصناف مختارة.

معظم المنتجات متوفرة في مخزننا الخاص ونجهزها للشحن مباشرة، وبعض الأصناف (يُشار إليها بوضوح على صفحة المنتج) تصل عبر موردين شركاء ونعرضها بنفس مستوى الوضوح في السعر والمواصفات ومدة التوصيل.

# ما نلتزم به
الوضوح في الأسعار والوصف ومدة التوصيل ومصدر كل منتج، والتواصل المباشر مع العميل، وسياسة استرجاع مكتوبة ومعلنة، وحماية بيانات العملاء.

# تواصل معنا
واتساب: 01021776980
البريد الإلكتروني: city89229@gmail.com`,
about_en:`# About Us
Abdeen is a single online marketplace for everything your home and family need, based in Al-Arbaeen St, Suez, Egypt.

We offer furniture and furnishings, groceries, produce, fresh fish and spices, clothing and shoes, electronics and appliances, home and professional services, car and bike supplies, and perfume and beauty — with clear pricing and discounts on selected items.

Most products are held in our own stock and dispatched directly. Some items (clearly marked on the product page) ship from partner suppliers, and we show the same clarity for their price, specifications and delivery time.

# What we stand for
Clear pricing, descriptions, delivery times and product source; direct communication with customers; a written, published return policy; and protection of customer data.

# Contact us
WhatsApp: 01021776980
Email: city89229@gmail.com`,
terms:`# شروط الاستخدام
باستخدامك هذا المتجر أو إتمام طلب شراء منه فأنت توافق على الشروط التالية.

# 1. الحساب
يجب أن تكون البيانات التي تسجلها صحيحة. أنت مسؤول عن سرية كلمة المرور وعن الأنشطة التي تتم عبر حسابك.

# 2. الأسعار والتوافر
الأسعار بالجنيه المصري وقد تتغير دون إشعار مسبق، والسعر المعتمد هو السعر وقت تأكيد الطلب. المنتجات المعروضة تخضع للتوافر، وقد نتواصل معك في حال عدم توفر صنف.

# 3. مصدر المنتجات
بعض المنتجات متوفرة في مخزننا الخاص، وبعضها الآخر يُشحن مباشرة من موردين شركاء (دروبشيبنج)، ويُشار إلى ذلك بوضوح على صفحة كل منتج. مدة التوصيل تختلف حسب مصدر المنتج، وهي معلنة على صفحة المنتج وعند إتمام الطلب.

# 4. الطلب والدفع
يُعد الطلب مؤكدًا بعد تواصل المتجر معك. نقبل الدفع عبر فودافون كاش على رقم المتجر المعلن أو الدفع عند الاستلام. لا يُعتد بالتحويل إلا بعد إرسال صورة إيصاله عبر واتساب.

# 5. الشحن والتسليم
يتم الاتفاق على موعد التسليم وتكلفة الشحن عند تأكيد الطلب وفق مدة التوصيل المعلنة لكل منتج، ويجب فحص المنتج عند الاستلام.

# 6. الاسترجاع والاستبدال
تسري سياسة الاسترجاع المنشورة في صفحة "سياسة الاسترجاع" وتُعد جزءًا من هذه الشروط.

# 7. حقوق الملكية
جميع الحقوق محفوظة للمتجر. جميع النصوص والشعارات والتصاميم والصور المنشورة محمية، ولا يجوز نسخها أو إعادة استخدامها دون إذن كتابي.

# 8. حدود المسؤولية
قد تختلف ألوان المنتجات على الشاشة عن الواقع بشكل طفيف. لا يتحمل المتجر أضرارًا ناتجة عن سوء الاستخدام.

# 9. القانون الواجب التطبيق
تخضع هذه الشروط لقوانين جمهورية مصر العربية.

# 10. التعديل
يحق للمتجر تعديل هذه الشروط، وتسري التعديلات من تاريخ نشرها في هذه الصفحة.`,
terms_en:`# Terms of Use
By using this store or placing an order, you agree to the following terms.

# 1. Your Account
The details you register must be accurate. You are responsible for keeping your password confidential and for activity on your account.

# 2. Prices & Availability
Prices are in Egyptian Pounds and may change without prior notice; the price at order confirmation is the binding one. Listed products are subject to availability, and we may contact you if an item is unavailable.

# 3. Product Source
Some products are held in our own stock, while others ship directly from partner suppliers (drop-shipping); this is clearly marked on each product page. Delivery time varies by product source and is shown on the product page and at checkout.

# 4. Ordering & Payment
An order is confirmed once the store contacts you. We accept Vodafone Cash to the store's published number, or cash on delivery. A transfer is only recognized after you send its screenshot on WhatsApp.

# 5. Shipping & Delivery

# 7. Intellectual Property

# 8. Limitation of Liability
Product colors may differ slightly on screen from reality. The store is not liable for damage resulting from misuse.

# 9. Governing Law
These terms are governed by the laws of the Arab Republic of Egypt.

# 10. Changes
The store may amend these terms, effective from the date they are published on this page.`,
privacy:`# سياسة الخصوصية
نحترم خصوصيتك ونلتزم بحماية بياناتك الشخصية وفق أحكام قانون حماية البيانات الشخصية المصري رقم 151 لسنة 2020.

# البيانات التي نجمعها
الاسم، رقم الهاتف، البريد الإلكتروني، عنوان التسليم، وتفاصيل الطلبات التي تنفذها.

# لماذا نستخدمها
لإنشاء حسابك، وتنفيذ الطلبات وتوصيلها، وتتبع حالة الطلب، والرد على استفساراتك ودعمك بعد البيع.

# المشاركة
لا نبيع بياناتك ولا نشاركها مع أي جهة إلا بالقدر اللازم لتنفيذ طلبك، مثل شركة الشحن، أو المورّد الشريك عند الحاجة لتنفيذ منتج دروبشيبنج (الاسم والهاتف والعنوان فقط)، أو إذا طلبت جهة قانونية مختصة ذلك.

# الحماية
نستخدم اتصالًا مشفرًا، ونخزن كلمات المرور بصورة مشفرة (لا نحتفظ بها كنص صريح)، ونقصر الوصول لبيانات الطلبات على المسؤولين المعتمدين.

# حقوقك
يحق لك الاطلاع على بياناتك وتصحيحها أو طلب حذفها، بمراسلتنا عبر واتساب أو البريد الإلكتروني المعلن في صفحة خدمة العملاء.

# ملفات الجلسة والتخزين المحلي
نستخدم التخزين المحلي في المتصفح لحفظ سلة التسوق وجلسة الدخول وتفضيل اللغة والوضع الليلي، ولا نستخدمه لتتبعك خارج المتجر.

# التعديلات
قد نحدّث هذه السياسة، وسيظهر تاريخ آخر تحديث في هذه الصفحة.`,
privacy_en:`# Privacy Policy
We respect your privacy and are committed to protecting your personal data under Egyptian Personal Data Protection Law No. 151 of 2020.

# Data We Collect
Name, phone number, email, delivery address, and details of the orders you place.

# Why We Use It
To create your account, fulfill and deliver orders, track order status, and respond to and support you after purchase.

# Sharing
We do not sell your data or share it with anyone beyond what an order requires — such as the shipping company, or a partner supplier when needed to fulfil a drop-shipped item (name, phone and address only) — or if a competent legal authority requests it.

# Protection
We use encrypted connections, store passwords in encrypted form (never as plain text), and limit access to order data to authorized staff.

# Your Rights
You may review or correct your data, or request its deletion, by contacting us on WhatsApp or the email published on the Customer Service page.

# Local Storage
We use your browser's local storage to keep your cart, sign-in session, language and theme preference; we do not use it to track you outside the store.

# Changes
We may update this policy; the last-updated date will appear on this page.`,
returns:`# سياسة الاسترجاع والاستبدال
حقك في الاسترجاع مصان وفق أحكام قانون حماية المستهلك المصري رقم 181 لسنة 2018.

# مدة الاسترجاع
يمكنك طلب الاستبدال أو الاسترجاع خلال 14 يومًا من تاريخ الاستلام إذا كان المنتج معيبًا أو مخالفًا للمواصفات المتفق عليها.

# منتجات الدروبشيبنج
المنتجات التي تُشحن من مورد شريك (موضّح على صفحة المنتج) يسري عليها نفس حقك في الاسترجاع خلال 14 يومًا، وقد تحتاج مدة معاينة أطول قليلًا لأنها تُرد إلى المورّد، وسنُبقيك على اطلاع بموعد استرداد قيمتها.

# الشروط
يجب أن يكون المنتج بحالته الأصلية وغير مستخدم، ومعه الفاتورة أو رقم الطلب.

# ما لا يشمله الاسترجاع
المنتجات المصنوعة أو المفصّلة حسب الطلب، والمنتجات التي تضررت بسبب سوء الاستخدام.

# التلف أثناء الشحن
يرجى فحص المنتج عند الاستلام وإبلاغنا فورًا عبر واتساب مع صورة للتلف.

# كيف تطلب الاسترجاع
تواصل مع خدمة العملاء عبر واتساب برقم الطلب وصور المنتج، وسنرد عليك لتحديد موعد المعاينة والاستلام.

# رد المبلغ
يُرد المبلغ بنفس وسيلة الدفع (فودافون كاش أو نقدًا) بعد استلام المنتج وفحصه.`,
returns_en:`# Return & Exchange Policy
Your right to return is protected under Egyptian Consumer Protection Law No. 181 of 2018.

# Return Window
You may request an exchange or return within 14 days of delivery if the product is defective or doesn't match the agreed specifications.

# Drop-Shipped Products
Products shipped from a partner supplier (marked on the product page) carry the same 14-day return right. They may need a slightly longer inspection period since they're returned to the supplier, and we'll keep you informed of your refund timing.

# Conditions
The product must be in its original, unused condition, with the invoice or order number.

# Not Covered
Custom-made or made-to-order products, and products damaged through misuse.

# Damage in Transit
Please inspect the product on delivery and notify us immediately on WhatsApp with a photo of the damage.

# How to Request a Return
Contact customer service on WhatsApp with your order number and product photos, and we'll arrange an inspection and pickup time.

# Refunds
Refunds are issued via the original payment method (Vodafone Cash or cash) after the product is received and inspected.`,
support:`# خدمة العملاء

واتساب: 01021776980

support_en:`# Customer Service

const PAGE_TITLES={about:'من نحن',terms:'شروط الاستخدام',privacy:'سياسة الخصوصية',returns:'سياسة الاسترجاع',support:'خدمة العملاء'};
const ST=[['new','تم استلام الطلب'],['confirmed','تم تأكيد الطلب'],['preparing','جاري التجهيز'],['shipping','في الطريق إليك'],['delivered','تم التسليم']];
const stName=k=>k==='cancelled'?'ملغي':(ST.find(s=>s[0]===k)||[0,k])[1];

/* ===== الحالة ===== */
const S={settings:{},pages:{},cats:[],products:[],priv:{},user:null,isAdmin:false,cart:[],orders:[],ready:false,menu:false};
let FB=null,unsubOrders=null,unsubPriv=null;
function loadLocal(){
  const d=store.get('wd_data',null),b=JSON.parse(JSON.stringify(DEF));
  S.settings={...b.settings,...(d&&d.settings)};S.pages={...b.pages,...(d&&d.pages)};
  S.cats=(d&&d.cats)||b.cats;S.products=(d&&d.products)||b.products;S.ready=true;
}
const persist=()=>{if(!FB)store.set('wd_data',{settings:S.settings,pages:S.pages,cats:S.cats,products:S.products})};
const cn=c=>!c?'':(LANG==='en'?(c.name_en||c.name):c.name)||'';
const catById=id=>S.cats.find(c=>c.id===id);
const catName=id=>cn(catById(id));
const catFeat=id=>{let c=catById(id);while(c){if(c.feat)return{kg:!!c.feat.kg,m:!!c.feat.m,colors:!!c.feat.colors,sizes:!!c.feat.sizes};c=c.parent?catById(c.parent):null}return{kg:true,m:true,colors:true,sizes:true}};
const topCats=()=>S.cats.filter(c=>!c.parent).sort((a,b)=>a.ord-b.ord);
const childCats=id=>S.cats.filter(c=>c.parent===id).sort((a,b)=>a.ord-b.ord);
const catMatch=(productCat,filterCat)=>{if(!filterCat)return true;if(productCat===filterCat)return true;const pc=catById(productCat);return !!pc&&pc.parent===filterCat};
const catBg=id=>{const c=catById(id);if(!c)return'';if(c.bg)return c.bg;return c.parent?catBg(c.parent):''};
const pn=p=>LANG==='en'?(p.name_en||p.name):p.name;
const pdsc=p=>LANG==='en'?(p.desc_en||p.desc):p.desc;
const sv=k=>LANG==='en'&&S.settings[k+'_en']?S.settings[k+'_en']:S.settings[k];
const pageText=k=>LANG==='en'?(S.pages[k+'_en']||S.pages[k]):S.pages[k];
const isDrop=p=>p&&p.src==='drop';
const outOf=p=>!isDrop(p)&&p.stock===0;
const leadOf=p=>{const raw=String((p&&p.lead)||(isDrop(p)?S.settings.leadDrop:S.settings.leadOwn)||(isDrop(p)?'7-14':'2-4'));const m=raw.match(/(\d+)\s*[-–]\s*(\d+)/);if(m)return[+m[1],+m[2]];const n=parseInt(raw);return isNaN(n)?(isDrop(p)?[7,14]:[2,4]):[n,n]};
const cartLead=()=>cartLines().reduce((a,{p})=>{const l=leadOf(p);return[Math.max(a[0],l[0]),Math.max(a[1],l[1])]},[0,0]);
const mixedCart=()=>{const L2=cartLines();return L2.some(x=>isDrop(x.p))&&L2.some(x=>!isDrop(x.p))};
const daysTxt=([a,b])=>LANG==='en'?(a===b?`${a} day${a>1?'s':''}`:`${a}–${b} days`):(a===b?`${nf.format(a)} ${a===1?'يوم':'أيام'}`:`${nf.format(a)}–${nf.format(b)} أيام`);
const unitLabel=u=>u==='kg'?L('كجم','kg'):u==='m'?L('م','m'):'';
const unitSuffix=u=>u&&u!=='piece'?' / '+unitLabel(u):'';
const parseColors=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean).map(x=>{const parts=x.split('|');const name=(parts[0]||'').trim(),hex=(parts[1]||'').trim();return{name,hex:/^#[0-9a-fA-F]{6}$/.test(hex)?hex:''}});
const parseSizes=v=>String(v||'').split(',').map(x=>x.trim()).filter(Boolean);
const colorsToStr=arr=>(arr||[]).map(c=>c.hex?`${c.name}|${c.hex}`:c.name).join(', ');
const sizesToStr=arr=>(arr||[]).join(', ');
const srcBadge=p=>isDrop(p)?`<span class="src drop">${L('يُشحن من مورد شريك','Ships from a partner supplier')}</span>`:`<span class="src own">${L('متوفر في مخزننا','In our own stock')}</span>`;
const disc=p=>p.old>p.price?Math.round((1-p.price/p.old)*100):0;
const maxDisc=()=>S.products.reduce((m,p)=>Math.max(m,disc(p)),0);
const phoneShow=()=>'0'+String(S.settings.phone||'').replace(/^20/,'');
const wa=t=>`https://wa.me/${S.settings.phone}?text=${encodeURIComponent(t)}`;

/* ===== السلة ===== */
const cartKey=()=>'wd_cart_'+(S.user?S.user.id:'guest');
function loadCart(){S.cart=store.get(cartKey(),[])}
function saveCart(){
  store.set(cartKey(),S.cart);
  if(FB&&S.user)FB.db.doc('users/'+S.user.id).set({cart:S.cart},{merge:true}).catch(()=>{});
}
function mergeCart(extra){
  const m=new Map();
  [...S.cart,...extra].forEach(l=>{
    const k=l.id+'|'+(l.color||'')+'|'+(l.size||''),cur=m.get(k);
    m.set(k,{id:l.id,color:l.color||'',size:l.size||'',q:Math.min(20,(cur?cur.q:0)+l.q)});
  });
  S.cart=[...m.values()];
}
const cartLines=()=>S.cart.map((l,i)=>({p:S.products.find(x=>x.id===l.id),q:l.q,color:l.color||'',size:l.size||'',i})).filter(x=>x.p);
const cartCount=()=>cartLines().reduce((a,l)=>a+l.q,0);
const cartTotal=()=>cartLines().reduce((a,l)=>a+l.p.price*l.q,0);
function addCart(id,q=1,color='',size=''){
  const p=S.products.find(x=>x.id===id);if(!p)return;
  if(outOf(p)){toast('هذا المنتج غير متوفر حاليًا');return}
  if(p.colors&&p.colors.length&&!color){toast(L('اختر اللون أولًا','Please choose a color first'));return}
  if(p.sizes&&p.sizes.length&&!size){toast(L('اختر المقاس أولًا','Please choose a size first'));return}
  color=color||'';size=size||'';
  const l=S.cart.find(x=>x.id===id&&(x.color||'')===color&&(x.size||'')===size);
  if(l)l.q=Math.min(20,l.q+q);else S.cart.push({id,q,color,size});
  saveCart();renderHeader();toast('تمت الإضافة إلى السلة');
  openCartDrawer();
}

/* ===== المصادقة ===== */
const enc=new TextEncoder();
async function pbk(secret,salt){
  if(!(window.crypto&&crypto.subtle))throw new Error('المتصفح لا يدعم التشفير المطلوب. استخدم متصفحًا حديثًا.');
  const k=await crypto.subtle.importKey('raw',enc.encode(secret),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',salt:enc.encode(salt),iterations:150000,hash:'SHA-256'},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');
}
const lockLeft=k=>{const l=store.get(k,{n:0,t:0});return l.t>Date.now()?Math.ceil((l.t-Date.now())/60000):0};
const lockFail=k=>{const l=store.get(k,{n:0,t:0});l.n++;if(l.n>=5){l.t=Date.now()+10*60000;l.n=0}store.set(k,l)};
const lockOk=k=>store.set(k,{n:0,t:0});
function normIdent(v){
  v=String(v||'').trim().replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c));
  if(v.includes('@'))return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)?{type:'email',v:v.toLowerCase()}:null;
  let d=v.replace(/\D/g,'');if(d.startsWith('00'))d=d.slice(2);if(/^01[0125]\d{8}$/.test(d))d='2'+d;
  return /^201[0125]\d{8}$/.test(d)?{type:'phone',v:d}:null;
}
const fbEmail=i=>i.type==='email'?i.v:i.v+'@phone.wadi.local';
const AUTH={
  async signUp(name,ident,pw){
    if(FB){
      const c=await FB.auth.createUserWithEmailAndPassword(fbEmail(ident),pw);
      await c.user.updateProfile({displayName:name});return;
    }
    const users=store.get('wd_users',[]);
    if(users.some(u=>u.ident===ident.v))throw new Error('هذا الحساب مسجّل بالفعل، سجّل الدخول.');
    const salt=[...crypto.getRandomValues(new Uint8Array(12))].map(b=>b.toString(16).padStart(2,'0')).join('');
    const u={id:uid('u'),name,ident:ident.v,type:ident.type,salt,hash:await pbk(pw,salt)};
    users.push(u);store.set('wd_users',users);setUser(u);
  },
  async signIn(ident,pw){
    if(FB){await FB.auth.signInWithEmailAndPassword(fbEmail(ident),pw);return}
    const key='wd_lock_login';
    if(lockLeft(key))throw new Error(`تم إيقاف المحاولات مؤقتًا. حاول بعد ${lockLeft(key)} دقيقة.`);
    const u=store.get('wd_users',[]).find(x=>x.ident===ident.v);
    const h=u?await pbk(pw,u.salt):null;
    if(!u||h!==u.hash){lockFail(key);throw new Error('بيانات الدخول غير صحيحة.')}
    lockOk(key);setUser(u);
  },
  async social(kind){
    if(!FB)throw new Error('الدخول بـ '+(kind==='google'?'جوجل':'فيسبوك')+' يعمل بعد ربط المتجر بمشروع Firebase (راجع ملف الإعداد).');
    if(kind!=='google')throw new Error('طريقة الدخول غير مدعومة');const pr=new firebase.auth.GoogleAuthProvider();
    await FB.auth.signInWithPopup(pr);
  },
  async reset(ident){
    if(FB&&ident.type==='email'){await FB.auth.sendPasswordResetEmail(ident.v);return true}
    return false;
  },
  async out(){
    if(FB){await FB.auth.signOut();return}
    store.set('wd_session',null);S.user=null;S.isAdmin=false;loadCart();
  }
};
function setUser(u){
  const guest=S.cart.slice();
  S.user={id:u.id,name:u.name,ident:u.ident,type:u.type};
  store.set('wd_session',u.id);
  const own=store.get(cartKey(),[]);S.cart=own;mergeCart(guest);saveCart();store.set('wd_cart_guest',[]);
  loadLocalOrders();
}
const loadLocalOrders=()=>{S.orders=store.get('wd_orders',[]).filter(o=>S.isAdmin||(S.user&&o.uid===S.user.id)).sort((a,b)=>b.ts-a.ts)};

/* ===== Firebase (اختياري) ===== */
const loadScript=src=>new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>rej(new Error('تعذر تحميل '+src));document.head.appendChild(s)});
async function initFirebase(){
  for(const f of ['app','auth','firestore'])await loadScript(`https://www.gstatic.com/firebasejs/10.12.2/firebase-${f}-compat.js`);
  firebase.initializeApp(CFG.firebase);
  FB={auth:firebase.auth(),db:firebase.firestore()};
  S.products=[];S.cats=[];
  FB.db.collection('products').onSnapshot(s=>{S.products=s.docs.map(x=>x.data());S.ready=true;softRender()},e=>{console.warn(e);S.ready=true;softRender()});
  FB.db.collection('categories').onSnapshot(s=>{S.cats=s.docs.map(x=>x.data()).sort((a,b)=>(a.ord||0)-(b.ord||0));softRender()},console.warn);
  FB.db.doc('settings/store').onSnapshot(x=>{if(x.exists){S.settings={...DEF.settings,...x.data()};softRender()}},console.warn);
  FB.db.doc('settings/pages').onSnapshot(x=>{if(x.exists){S.pages={...DEF.pages,...x.data()};softRender()}},console.warn);
  FB.auth.onAuthStateChanged(onFbUser);
}
async function onFbUser(u){
  if(unsubOrders){unsubOrders();unsubOrders=null}
  if(unsubPriv){unsubPriv();unsubPriv=null}
  if(!u){S.user=null;S.isAdmin=false;S.orders=[];loadCart();render();return}
  const em=u.email||'';
  S.user={id:u.uid,name:u.displayName||(em&&!em.endsWith('@phone.wadi.local')?em:'عميل'),ident:em.endsWith('@phone.wadi.local')?em.split('@')[0]:em,type:em.endsWith('@phone.wadi.local')?'phone':'email'};
  try{S.isAdmin=(await FB.db.doc('admins/'+u.uid).get()).exists}catch{S.isAdmin=false}
  try{const c=await FB.db.doc('users/'+u.uid).get();const guest=store.get('wd_cart_guest',[]);S.cart=[];mergeCart([...(c.exists?c.data().cart||[]:[]),...guest]);store.set('wd_cart_guest',[]);saveCart()}catch{loadCart()}
  if(S.isAdmin)unsubPriv=FB.db.collection('productPrivate').onSnapshot(sn=>{S.priv={};sn.docs.forEach(d=>S.priv[d.id]=d.data());softRender()},console.warn);else S.priv={};
  const q=S.isAdmin?FB.db.collection('orders'):FB.db.collection('orders').where('uid','==',u.uid);
  unsubOrders=q.onSnapshot(s=>{S.orders=s.docs.map(x=>x.data()).sort((a,b)=>b.ts-a.ts);softRender()},console.warn);
  closeModal();render();
}
let raf=0;const softRender=()=>{cancelAnimationFrame(raf);raf=requestAnimationFrame(render)};

/* ===== عمليات البيانات ===== */
async function putPriv(id,obj){
  if(FB){await FB.db.collection('productPrivate').doc(id).set(obj);return}
  S.priv[id]=obj;store.set('wd_priv',S.priv);
}
async function delPriv(id){
  if(FB){try{await FB.db.collection('productPrivate').doc(id).delete()}catch(e){console.warn(e)}return}
  delete S.priv[id];store.set('wd_priv',S.priv);
}
async function put(col,obj){
  if(FB){await FB.db.collection(col).doc(obj.id).set(obj);return}
  const arr=col==='products'?S.products:S.cats,i=arr.findIndex(x=>x.id===obj.id);
  if(i<0)arr.push(obj);else arr[i]=obj;persist();
}
async function del(col,id){
  if(FB){await FB.db.collection(col).doc(id).delete();return}
  if(col==='products')S.products=S.products.filter(x=>x.id!==id);else S.cats=S.cats.filter(x=>x.id!==id);persist();
}
async function putDoc(id,obj){
  if(FB){await FB.db.doc('settings/'+id).set(obj);return}
  if(id==='store')S.settings=obj;else S.pages=obj;persist();
}
async function seed(){
  if(!FB)return;const b=FB.db.batch();
  DEF.cats.forEach(c=>b.set(FB.db.collection('categories').doc(c.id),c));
  DEF.products.forEach(p=>b.set(FB.db.collection('products').doc(p.id),p));
  b.set(FB.db.doc('settings/store'),DEF.settings);b.set(FB.db.doc('settings/pages'),DEF.pages);
  await b.commit();

function invoiceText(o){

function syncFeat(){
  const sel=$('#pfCat');if(!sel)return;const ft=catFeat(sel.value),u=$('#pfUnit');
  $('#ftUnit').style.display=(ft.kg||ft.m||(u&&u.value!=='piece'))?'block':'none';
  $('#ftColors').style.display=ft.colors?'block':'none';$('#ftSizes').style.display=ft.sizes?'block':'none';
}
function resizeImage(file){
  return new Promise((res,rej)=>{
    if(!/^image\/(jpeg|png|webp)$/.test(file.type))return rej(new Error('نوع الصورة غير مدعوم'));
    if(file.size>8*1024*1024)return rej(new Error('حجم الصورة كبير (الحد 8 ميجا)'));
    const url=URL.createObjectURL(file),im=new Image();
    im.onload=()=>{const m=700,k=Math.min(1,m/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.72))};
    im.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('تعذر قراءة الصورة'))};im.src=url;
  });
}

const ACT={
  menu(){S.menu=!S.menu;renderHeader()},
  theme(){const next=curTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);store.set('wd_theme',next);renderHeader();render()},
  lang(){LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('wd_lang',JSON.stringify(LANG))}catch{}applyLang();render()},
  login(){S.menu=false;renderHeader();authModal('login')},
  signup(){S.menu=false;renderHeader();authModal('signup')},
  forgot(){authModal('forgot')},
  closeModal,
  ovl(el,_,e){if(e.target===el)closeModal()},
  async logout(){S.menu=false;await AUTH.out();closeModal();location.hash='#/';render();toast('تم تسجيل الخروج')},
  async social(el,id){
    if(id==='fb'||id==='ig'){const u=S.settings[id];if(/^https:\/\//.test(u||''))window.open(u,'_blank','noopener');else toast('سيُضاف رابط '+(id==='fb'?'صفحة فيسبوك':'حساب إنستجرام')+' قريبًا');return}
    await AUTH.social(id);
  },
  add(el,id){addCart(id)},
  addq(el,id){addCart(id,+($('#pq').textContent)||1,selColor,selSize)},
  pickColor(el,id){selColor=id;el.parentElement.querySelectorAll('.swatch').forEach(b=>b.classList.remove('on'));el.classList.add('on');const lbl=$('#selColorLbl');if(lbl)lbl.textContent=id},
  pickSize(el,id){selSize=id;el.parentElement.querySelectorAll('.szchip').forEach(b=>b.classList.remove('on'));el.classList.add('on')},
  drawerClose(el,_,e){if(el.classList.contains('overlay')&&e.target!==el)return;closeCartDrawer()},
  pq(el){const n=$('#pq');n.textContent=Math.max(1,Math.min(20,(+n.textContent||1)+ +el.dataset.d))},
  qty(el,id){const l=S.cart[+id];if(!l)return;l.q+= +el.dataset.d;if(l.q<1)l.q=1;if(l.q>20)l.q=20;saveCart();render();renderCartDrawer()},
  rm(el,id){S.cart.splice(+id,1);saveCart();render();renderCartDrawer()},
  adminOut(){S.isAdmin=false;loadLocalOrders();location.hash='#/';render()},
  prodNew(){prodForm(null)},
  prodEdit(el,id){prodForm(S.products.find(p=>p.id===id))},
  imgRm(el,id){tmpImgs.splice(+id,1);renderImgGrid()},
  swapImg(el,id){const m=$('#pdMain');if(m)m.src=id;el.parentElement.querySelectorAll('.gthumb').forEach(b=>b.classList.remove('on'));el.classList.add('on')},
  async prodDel(el,id){const p=S.products.find(x=>x.id===id);if(p&&confirm('حذف المنتج "'+p.name+'"؟'))await del('products',id),await delPriv(id),toast('تم حذف المنتج'),render()},
  async catDel(el,id){if(S.products.some(p=>p.cat===id))return toast('هذا القسم به منتجات. انقلها أو احذفها أولًا.');if(S.cats.some(c=>c.parent===id))return toast('هذا القسم له أقسام فرعية. احذفها أولًا.');if(confirm('حذف القسم؟'))await del('categories',id),toast('تم حذف القسم'),render()},
  async seed(){await seed();toast('تم تحميل البيانات الافتراضية')}
};

    if(t.matches('[data-sort]')){const h=location.hash.split('?'),p=new URLSearchParams(h[1]||'');t.value?p.set('s',t.value):p.delete('s');location.hash='#/shop?'+p}
    else if(t.matches('[data-pf]')){const p=S.products.find(x=>x.id===t.dataset.id);if(!p)return;const v=Math.max(0,Math.round(+t.value||0));if(t.dataset.pf==='price'&&v<1){t.value=p.price;return toast('السعر يجب أن يكون أكبر من صفر')}p[t.dataset.pf]=v;await put('products',p);toast('تم حفظ السعر');render()}
    else if(t.matches('[data-cf]')){const c=S.cats.find(x=>x.id===t.dataset.cf),v=t.value.trim();if(c&&v){c.name=v;await put('categories',c);toast('تم حفظ اسم القسم');renderHeader()}}
    else if(t.matches('[data-cfen]')){const c=S.cats.find(x=>x.id===t.dataset.cfen);if(c){c.name_en=t.value.trim();await put('categories',c);toast('تم حفظ الاسم الإنجليزي')}}
    else if(t.matches('[data-cbg]')){const c=S.cats.find(x=>x.id===t.dataset.cbg);if(c){c.bg=t.value.trim();await put('categories',c);toast('تم حفظ خلفية القسم')}}
    else if(t.matches('[data-st]')){const o=S.orders.find(x=>x.id===t.dataset.st);if(!o)return;o.status=t.value;if(FB)await FB.db.doc('orders/'+o.id).update({status:o.status});else{const all=store.get('wd_orders',[]),i=all.findIndex(x=>x.id===o.id);if(i>=0){all[i].status=o.status;store.set('wd_orders',all)}}toast('تم تحديث حالة الطلب');render()}
    else if(t.matches('[data-file]')&&t.files.length){
      const room=4-tmpImgs.length,files=Array.from(t.files).slice(0,room);
      if(t.files.length>room)toast(L(`أضيفت ${room} فقط، الحد الأقصى 4 صور`,`Only ${room} added — 4 images max`));
      for(const file of files){try{tmpImgs.push(await resizeImage(file))}catch(err){toast(err.message)}}
      t.value='';renderImgGrid();
    }
    else if(t.matches('#pfCat,#pfUnit')){syncFeat()}
    else if(t.matches('[data-cicon]')){const c=S.cats.find(x=>x.id===t.dataset.cicon);if(c){c.icon=t.value.trim().slice(0,4);await put('categories',c);toast('تم حفظ الأيقونة')}}
    else if(t.matches('[data-cfeat]')){const[id,k]=t.dataset.cfeat.split('|'),c=S.cats.find(x=>x.id===id);if(c){c.feat={...catFeat(id),[k]:t.checked};await put('categories',c);toast('تم حفظ الخصائص');render()}}
    else if(t.matches('input[data-act-src]')){const own=$('#ownFields'),drop=$('#dropFields');if(own&&drop){const isDropSel=t.value==='drop';own.style.display=isDropSel?'none':'block';drop.style.display=isDropSel?'block':'none'}}
  }catch(err){toast(err.message||'حدث خطأ')}
});
const showErr=(f,m)=>{m=trText(m);const e=$('.err',f);if(e)e.textContent=m;else toast(m)};
const FORM={
  search(f){const q=new FormData(f).get('q').trim();location.hash=q?'#/shop?q='+encodeURIComponent(q):'#/shop'},
  async auth(f){
    const d=new FormData(f),mode=f.dataset.mode,ident=normIdent(d.get('ident')),pw=String(d.get('pw')||''),name=String(d.get('name')||'').trim();
    if(!ident)return showErr(f,'أدخل بريدًا إلكترونيًا صحيحًا أو رقم موبايل مصري صحيحًا.');
    if(mode==='signup'){if(name.length<2)return showErr(f,'أدخل اسمك.');if(pw.length<8)return showErr(f,'كلمة المرور 8 أحرف على الأقل.');await AUTH.signUp(name,ident,pw)}
    else await AUTH.signIn(ident,pw);
    closeModal();renderHeader();render();toast('أهلًا بك');
  },
  async forgot(f){
    const ident=normIdent(new FormData(f).get('ident'));if(!ident)return showErr(f,'أدخل بريدًا إلكترونيًا أو رقم هاتف صحيحًا.');
    const ok=await AUTH.reset(ident);
    if(ok){closeModal();toast('أرسلنا رابط الاستعادة إلى بريدك إن كان مسجلًا لدينا')}
    else{closeModal();openModal(`<h2>استعادة كلمة المرور</h2><p>لاستعادة الوصول إلى حسابك تواصل مع خدمة العملاء على واتساب وسنساعدك بعد التحقق من هويتك.</p><a class="btn btn-wa btn-block" target="_blank" rel="noopener noreferrer" href="${esc(wa('مرحبًا، نسيت كلمة مرور حسابي ('+ident.v+')'))}">${IC.wa} تواصل عبر واتساب</a>`)}
  },
  async checkout(f){
    const d=Object.fromEntries(new FormData(f)),ph=normIdent(d.phone);
    if(String(d.name).trim().length<3)return showErr(f,'أدخل اسمك بالكامل.');
    if(!ph||ph.type!=='phone')return showErr(f,'أدخل رقم موبايل مصري صحيحًا.');
    if(String(d.city).trim().length<2||String(d.address).trim().length<5)return showErr(f,'أدخل المدينة والعنوان بالتفصيل.');
    const items=cartLines().map(({p,q,color,size})=>({id:p.id,name:p.name,price:p.price,q,src:p.src||'own',lead:p.lead||'',color:color||'',size:size||''}));if(!items.length)return showErr(f,'السلة فارغة.');
    const ship=+S.settings.shipping||0;
    let o={id:'AB-'+new Date().toISOString().slice(2,10).replace(/-/g,'')+'-'+Math.random().toString(36).slice(2,6).toUpperCase(),uid:S.user.id,name:String(d.name).trim(),phone:'0'+ph.v.slice(2),city:String(d.city).trim(),address:String(d.address).trim(),notes:String(d.notes||'').trim(),pay:d.pay==='cod'?'cod':'vodafone',items,shipping:ship,total:items.reduce((a,i)=>a+i.price*i.q,0)+ship,status:'new',ts:Date.now()};
    if(FB){
      if(!CFG.api)throw new Error('خادم الطلبات غير مُعدّ بعد. تواصل مع المتجر على واتساب.');
      const tok=await FB.auth.currentUser.getIdToken(),ac=new AbortController(),tm=setTimeout(()=>ac.abort(),45000);
      let r;
      try{r=await fetch(CFG.api.replace(/\/$/,'')+'/api/orders',{method:'POST',signal:ac.signal,headers:{'Content-Type':'application/json',Authorization:'Bearer '+tok},body:JSON.stringify({items:items.map(i=>({id:i.id,q:i.q,color:i.color||'',size:i.size||''})),name:o.name,phone:o.phone,city:o.city,address:o.address,notes:o.notes,pay:o.pay})})}
      catch{throw new Error('تعذر الوصول لخادم الطلبات. أعد المحاولة بعد لحظات.')}
      finally{clearTimeout(tm)}
      const j=await r.json().catch(()=>({}));
      if(!r.ok||!j.order)throw new Error(j.error||'تعذر إرسال الطلب، حاول مرة أخرى.');
      o=j.order;if(!S.orders.some(x=>x.id===o.id))S.orders.unshift(o);
    }else{const all=store.get('wd_orders',[]);all.push(o);store.set('wd_orders',all);loadLocalOrders()}
    S.cart=[];saveCart();renderHeader();
    const w=window.open(wa(invoiceText(o)),'_blank','noopener');
    location.hash='#/done/'+o.id;
    if(!w)toast('اضغط زر "إرسال الفاتورة على واتساب" لإتمام الطلب');
  },
  async adminlogin(f){
    const d=new FormData(f),key='wd_lock_admin';
    if(lockLeft(key))return showErr(f,`تم إيقاف المحاولات مؤقتًا. حاول بعد ${lockLeft(key)} دقيقة.`);
    const ph=normIdent(d.get('phone')),pin=String(d.get('pin')||'');let ok=false;
    if(ph&&ph.type==='phone'&&/^\d{4}$/.test(pin)){for(const a of CFG.admins){if(await pbk(ph.v+'|'+pin,a.salt)===a.hash)ok=true}}
    if(!ok){lockFail(key);return showErr(f,'بيانات الدخول غير صحيحة.')}
    lockOk(key);S.isAdmin=true;loadLocalOrders();render();toast('مرحبًا بك في لوحة التحكم');
  },
  async cat(f){const d=Object.fromEntries(new FormData(f)),n=String(d.name||'').trim();if(!n)return;await put('categories',{id:uid('c'),name:n,name_en:String(d.name_en||'').trim(),parent:d.parent||null,bg:'',ord:Date.now()});toast('تمت إضافة القسم');render()},
  async store(f){
    const d=Object.fromEntries(new FormData(f)),ph=String(d.phone).replace(/\D/g,'');
    if(!/^20\d{10}$/.test(ph))return showErr(f,'رقم الواتساب بصيغة دولية مثل 201021776980');
    const url=u=>{u=String(u||'').trim();return u===''||/^https:\/\//.test(u)?u:null};
    if(url(d.fb)===null||url(d.ig)===null)return showErr(f,'روابط التواصل يجب أن تبدأ بـ https://');
    const hexOk=c=>/^#[0-9a-fA-F]{6}$/.test(c||'');
    if(!hexOk(d.colorPrimary)||!hexOk(d.colorAccent))return showErr(f,'اختر لونًا صحيحًا.');
    const leadOk=v=>v===''||/^\d+(\s*[-–]\s*\d+)?$/.test(String(v).trim());
    if(!leadOk(d.leadOwn)||!leadOk(d.leadDrop))return showErr(f,'صيغة مدة التوصيل غير صحيحة، مثل 2-4.');
    await putDoc('store',{name:String(d.name).trim(),tagline:String(d.tagline).trim(),tagline_en:String(d.tagline_en||'').trim(),address:String(d.address).trim(),address_en:String(d.address_en||'').trim(),phone:ph,email:String(d.email).trim(),fb:String(d.fb).trim(),ig:String(d.ig).trim(),shipping:Math.max(0,+d.shipping||0),hours:String(d.hours||'').trim(),hours_en:String(d.hours_en||'').trim(),leadOwn:String(d.leadOwn||'2-4').trim(),leadDrop:String(d.leadDrop||'7-14').trim(),heroImg:String(d.heroImg||'').trim(),siteBg:String(d.siteBg||'').trim(),shopBg:String(d.shopBg||'').trim(),cartBg:String(d.cartBg||'').trim(),heroTitle:String(d.heroTitle||'').trim(),heroTitle_en:String(d.heroTitle_en||'').trim(),heroSubtitle:String(d.heroSubtitle||'').trim(),heroSubtitle_en:String(d.heroSubtitle_en||'').trim(),storeIcon:String(d.storeIcon||'').trim(),designLogo:String(d.designLogo||'').trim(),designCredit:String(d.designCredit||'').trim(),colorPrimary:d.colorPrimary,colorAccent:d.colorAccent});
    toast('تم حفظ بيانات المتجر');render();
  },
  async pages(f){const d=Object.fromEntries(new FormData(f)),o={...S.pages};Object.keys(PAGE_TITLES).forEach(k=>{o[k]=String(d[k]||'');o[k+'_en']=String(d[k+'_en']||'')});await putDoc('pages',o);toast('تم حفظ الصفحات');render()},
  async prod(f){
    const d=Object.fromEntries(new FormData(f)),price=Math.round(+d.price),old=Math.round(+d.old||0),src=d.src==='drop'?'drop':'own';
    if(!String(d.name).trim())return showErr(f,'أدخل اسم المنتج.');
    if(!(price>0))return showErr(f,'أدخل سعرًا صحيحًا.');
    if(old&&old<=price)return showErr(f,'السعر قبل الخصم يجب أن يكون أكبر من السعر الحالي.');
    if(src==='drop'&&!String(d.supplier||'').trim())return showErr(f,'أدخل اسم المورّد لمنتجات الدروبشيبنج.');
    const leadOk=v=>v===''||/^\d+(\s*[-–]\s*\d+)?$/.test(String(v).trim());
    if(!leadOk(d.lead))return showErr(f,'صيغة مدة التوصيل غير صحيحة، مثل 3-5.');
    const surl=String(d.supplierUrl||'').trim();if(surl&&!/^https:\/\//.test(surl))return showErr(f,'رابط المورّد يجب أن يبدأ بـ https://');
    if(tmpImgs.join('').length>850000)return showErr(f,'حجم الصور كبير جدًا، قلّل عددها أو استخدم صورًا أصغر.');
    const ft=catFeat(d.cat),unit=['piece','kg','m'].includes(d.unit)?d.unit:'piece';
    await put('products',{id:d.id,cat:d.cat,name:String(d.name).trim(),name_en:String(d.name_en||'').trim(),price,old,desc:String(d.desc||'').trim(),desc_en:String(d.desc_en||'').trim(),stock:src==='drop'?null:Math.max(0,Math.round(+d.stock||0)),src,lead:String(d.lead||'').trim(),unit,colors:ft.colors?parseColors(d.colors):[],sizes:ft.sizes?parseSizes(d.sizes):[],imgs:tmpImgs.slice(0,4),img:tmpImgs[0]||''});
    if(src==='drop')await putPriv(d.id,{supplier:String(d.supplier||'').trim(),url:surl});else await delPriv(d.id);
    closeModal();toast('تم حفظ المنتج');render();
  }
};
document.addEventListener('submit',async e=>{
  const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();
  const b=$('button[type=submit]',f);if(b)b.disabled=true;
  try{await FORM[f.dataset.form](f)}catch(err){showErr(f,fbMsg(err))}finally{if(b)b.disabled=false}
});
function fbMsg(e){
  const c=e&&e.code||'';
  if(/auth\/(invalid-credential|wrong-password|user-not-found|invalid-login-credentials)/.test(c))return 'بيانات الدخول غير صحيحة.';
  if(c==='auth/email-already-in-use')return 'هذا الحساب مسجّل بالفعل، سجّل الدخول.';
  if(c==='auth/weak-password')return 'كلمة المرور ضعيفة، استخدم 8 أحرف أو أكثر.';
  if(c==='auth/too-many-requests')return 'محاولات كثيرة. حاول لاحقًا.';
  if(c==='permission-denied'||/permission/i.test(c))return 'ليست لديك صلاحية لهذه العملية.';
  return e&&e.message||'حدث خطأ، حاول مرة أخرى.';
}

/* ===== التوجيه والعرض ===== */
function parse(){const h=location.hash.slice(1)||'/',[p,qs]=h.split('?');return{parts:p.split('/').filter(Boolean),q:Object.fromEntries(new URLSearchParams(qs||''))}}
function render(){
  applyLang();applyBrand();
  const{parts,q}=parse(),k=parts[0]||'';let html;
  if(!S.ready)html='<div class="wrap empty">جارٍ التحميل…</div>';
  else if(k==='')html=vHome();else if(k==='shop')html=vShop(q);else if(k==='p')html=vProduct(parts[1]);
  else if(k==='cart')html=vCart();else if(k==='checkout')html=vCheckout();else if(k==='done')html=vDone(parts[1]);
  else if(k==='account')html=vAccount();else if(k==='page')html=vPage(parts[1]);else if(k==='admin')html=vAdmin(q);
  else html='<div class="wrap empty"><h2>الصفحة غير موجودة</h2><a class="btn btn-teal" href="#/">الرئيسية</a></div>';
  document.title=(LANG==='en'&&S.settings.name_en)||S.settings.name||'المتجر';
  renderHeader();$('#app').innerHTML=trHTML(html);renderFooter();
}
window.addEventListener('hashchange',()=>{S.menu=false;closeCartDrawer();render();window.scrollTo(0,0)});

/* ===== الإقلاع ===== */
(async function boot(){
  applyTheme();applyLang();
  loadLocal();
  if(CFG.firebase){
    try{await initFirebase()}catch(e){console.warn(e);FB=null;loadLocal();toast('تعذر الاتصال بقاعدة البيانات، يعمل المتجر في الوضع المحلي')}
  }
  if(!FB){
    const sid=store.get('wd_session',null),u=sid&&store.get('wd_users',[]).find(x=>x.id===sid);
    if(u){S.user={id:u.id,name:u.name,ident:u.ident,type:u.type}}
    loadCart();loadLocalOrders();S.priv=store.get('wd_priv',{});
  }
  render();
  render();
})();
})();
</script>
