<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>لوحة التحكم — المؤسسة الوطنية</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="assets/logo.jpg">
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Tajawal:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.17"></script>
<style>
body{font-family:Tajawal,sans-serif;color:#101828}
.bg-royal{background:#0B2A6B}.text-royal{color:#0B2A6B}
.field{width:100%;border:1px solid #d0d5dd;border-radius:6px;padding:.65rem .8rem;background:#fff;color:#101828}
.field:focus{outline:2px solid #C9A227;border-color:#C9A227}
.btn{background:#0B2A6B;color:#fff;padding:.6rem 1.2rem;border-radius:6px;font-weight:700}
.btn:hover{background:#143C94}.btn:disabled{opacity:.6;cursor:wait}
.btn-gold{background:#C9A227;color:#0B2A6B}.btn-gold:hover{background:#E8C95A}
</style>
</head>
<body id="admin" class="bg-gray-100 min-h-screen">
<section id="login" class="max-w-sm mx-auto mt-24 bg-white p-6 rounded shadow space-y-3">
  <h1 class="font-bold text-xl text-royal">دخول المسؤول</h1>
  <input id="email" type="email" class="field" placeholder="البريد الإلكتروني" autocomplete="username">
  <input id="password" type="password" class="field" placeholder="كلمة المرور" autocomplete="current-password">
  <button id="login-btn" class="btn w-full">دخول</button>
  <button id="google-btn" class="btn btn-gold w-full">الدخول بحساب Gmail</button>
  <p id="login-error" class="text-red-600 text-sm break-all select-all"></p>
</section>
<section id="panel" class="hidden max-w-5xl mx-auto p-4">
  <header class="flex justify-between items-center bg-royal text-white p-4 rounded"><b>لوحة التحكم</b><button id="logout" class="text-sm underline">خروج</button></header>
  <nav id="tabs" class="flex flex-wrap gap-2 my-4 text-sm"></nav>
  <div class="bg-white rounded shadow p-4">
    <form id="form" class="space-y-3 mb-6"></form>
    <p id="status" class="text-sm mb-3"></p>
    <ul id="list" class="divide-y"></ul>
  </div>
</section>
<script type="module" src="app.js"></script>
</body>
</html>
